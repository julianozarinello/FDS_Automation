# ============================================================
#  FDS Automation v1.18 — Painel de Controle
# ============================================================

# ----------------------------------------------------------
# MODO DE SELEÇÃO DE ARQUIVOS (escolha apenas uma opção)
#
#  Opção A — Pasta: detecta todos os .fds automaticamente
#  Opção B — Lista manual de arquivos
#  Opção C — Arquivo único
#
# Prioridade: pasta_simulacoes > simulacoes > arquivo_fds
# ----------------------------------------------------------

# Opção A (RECOMENDADA): aponte para a pasta com os arquivos .fds
pasta_simulacoes: "C:/Programas/FDS_Automation/AURORA - FDS"

# Opção B: lista manual (comente 'pasta_simulacoes' para usar)
# simulacoes:
#   - "C:/Projetos/FDS/Caso_01.fds"
#   - "C:/Projetos/FDS/Caso_02.fds"

# Opção C: arquivo único (comente as anteriores para usar)
# arquivo_fds: "C:/Projetos/FDS/Pyrosim.fds"

# ----------------------------------------------------------
# INSTALAÇÃO DO FDS
# ----------------------------------------------------------
diretorio_fds: "C:/Program Files/firemodels/FDS6/bin"

# ----------------------------------------------------------
# AUTO-CONFIGURAÇÃO DE HARDWARE
# ----------------------------------------------------------
# Se true, detecta CPUs físicos, meshes e escolhe modo/núcleos
# automaticamente. Os campos abaixo (modo, num_cores, hybrid)
# são usados apenas quando auto_config: false.
auto_config: true

# ----------------------------------------------------------
# PARALELISMO MANUAL (ignorado se auto_config: true)
# ----------------------------------------------------------
# Modo de execução: SERIAL | OPENMP | MPI | HYBRID
modo: "OPENMP"

# Número de threads (OPENMP) ou processos MPI (MPI)
num_cores: 20

# Apenas para o modo HYBRID — total = mpi_procs × omp_threads
hybrid:
  mpi_procs: 4
  omp_threads: 5

# ----------------------------------------------------------
# CPU HÍBRIDA (P-core / E-core)
# Em CPUs Intel 12a gen+ com núcleos de performance e eficiência,
# o auto_config usa por padrão apenas os P-cores (mais rápidos para
# o FDS). Mude para true para contar também os E-cores.
# ----------------------------------------------------------
hybrid_cpu:
  usar_e_cores: false

# ----------------------------------------------------------
# MESH SPLITTER
# Balanceia MPI_PROCESS sem mudar a ordem das meshes.
# A divisao geometrica e uma opcao avancada separada.
# Ativo apenas nos modos MPI e HYBRID.
# O arquivo original é preservado em um backup (.fds.bak).
# ----------------------------------------------------------
mesh_splitter:
  ativo:      true
  margem_pct: 7.0     # % máximo de desequilíbrio de células entre núcleos
  dry_run:    false    # true = apenas loga, NÃO modifica o arquivo
  pular_se_otimizado: true # true = nao reescreve se MPI_PROCESS ja estiver balanceado
  # Criar novas interfaces entre meshes pode alterar levemente o resultado
  # numerico. Por seguranca fica desligado; ative apenas com validacao de
  # engenharia do caso original x otimizado.
  permitir_divisao: false
  max_meshes_por_core: 4   # limite conservador quando permitir_divisao=true
  peso_espacial: 0.15      # mantido por compatibilidade; a ordem agora e preservada

# ----------------------------------------------------------
# PERFORMANCE
# Desative com false caso encontre instabilidade.
# ----------------------------------------------------------
performance:
  kmp_affinity: true   # Fixa threads a núcleos físicos
  omp_spin:     true   # Threads em spin-wait (menos latência)
  numa_opt:     true   # Otimização NUMA (CPUs multi-socket)
  fixar_afinidade_os: true # Fixa prioridade ALTA e afinidade de CPU
                            # diretamente nos processos fds.exe (o Windows
                            # nao propaga isso do mpiexec para os ranks).
                            # Em CPU hibrida, mantem o FDS fora dos E-cores.
                            # v1.17+: em MPI/HYBRID os nucleos sao divididos
                            # em fatias, uma por rank (nao mais todos para
                            # todos, que desfazia o pinning do Intel MPI).
  omp_stacksize: "16M"      # Pilha defensiva por thread OpenMP.
  mkl_threads: 0             # 0 = automatico: 1 em MPI puro e o mesmo
                             # numero de threads do modo nos demais casos.
  mpi_shm: true             # Intel MPI 100% em memoria compartilhada
                            # (maquina unica). Use false apenas se rodar
                            # em cluster com mais de um computador.

# ----------------------------------------------------------
# AUTO-BENCHMARK
# Roda testes curtos em copia temporaria do .fds para escolher
# o modo mais rapido sem alterar a simulacao original.
# Deixe false se quiser iniciar a fila imediatamente.
# ----------------------------------------------------------
auto_benchmark:
  ativo: false
  tempo_max_seg: 45
  modos: ["SERIAL", "OPENMP", "MPI", "HYBRID"]

# ----------------------------------------------------------
# OTIMIZADOR EMPIRICO
# Testa configuracoes curtas em copia temporaria, mede o
# avanco real pelo Time Step do FDS e usa cache por caso/hardware.
# No padrao seguro altera apenas paralelismo e MPI_PROCESS.
# Criar novas interfaces depende de permitir_divisao=true.
# ----------------------------------------------------------
otimizador:
  ativo: true
  tempo_teste_seg: 45
  max_tentativas: 10
  melhoria_min_pct: 3.0
  usar_cache: true
  cache_max_entradas: 100
  testar_modos: ["SERIAL", "OPENMP", "MPI", "HYBRID"]
  # A ordem de &MESH e preservada; variacoes antigas deste peso nao sao mais
  # testadas porque nao mudariam a distribuicao segura.
  testar_peso_espacial: [0.15]
  # 2, 4 e o total ja sao testados. true acrescenta valores intermediarios.
  testar_threads_openmp: false
  copiar_arquivos_auxiliares: true
  copiar_arquivos_ate_mb: 250

# ----------------------------------------------------------
# FIREWALL DO WINDOWS
# O Windows pergunta "Deseja permitir que este aplicativo se
# comunique?" para cada executavel FDS/MPI em cada pasta nova.
# Com auto_liberar: true o programa cadastra as liberacoes
# automaticamente (em silencio se rodando como administrador;
# senao, o menu tem a opcao "Parar as perguntas do Windows",
# que pede permissao UMA unica vez).
# ----------------------------------------------------------
firewall:
  auto_liberar: true

# ----------------------------------------------------------
# FILA DINAMICA
# Com a fila JA RODANDO, novas subpastas com .fds adicionadas
# a pasta principal sao detectadas automaticamente (a pasta e
# re-escaneada ao fim de cada simulacao) e entram no FINAL da
# fila. 'otimizar_novas' faz o otimizador descobrir a melhor
# configuracao para essas simulacoes novas antes de rodar,
# mesmo que a fila tenha comecado sem otimizador.
# ----------------------------------------------------------
fila_dinamica:
  ativo: true
  otimizar_novas: true
  idade_min_seg: 10   # ignora .fds modificados ha menos de N s (copia em andamento)

# ----------------------------------------------------------
# MONITORAMENTO EM PLANILHA COMPARTILHADA (.xlsx)
# Atualiza uma planilha com o andamento das simulacoes deste
# PC: rodando, concluida, erro (e qual erro), progresso e ETA.
# Aponte 'arquivo_xlsx' para um arquivo dentro de uma pasta
# sincronizada (Google Drive para Desktop, OneDrive ou rede) e
# a equipe inteira acompanha todos os PCs na mesma planilha —
# cada PC atualiza apenas as proprias linhas.
# A aba "Acompanhamento" da interface grafica preenche esta
# secao automaticamente.
# ----------------------------------------------------------
monitoramento:
  ativo: false
  arquivo_xlsx: ""
  usuario: ""
  empresa: ""
  pc: ""
  intervalo_seg: 60

# ----------------------------------------------------------
# INTERFACE DO CONSOLE
# Mantem a tela limpa durante a execucao. O log completo do
# FDS continua sendo salvo em fds_run.log.
# ----------------------------------------------------------
interface:
  console_amigavel: true           # true = mostra apenas status principal no console
  limpar_console: true             # true = limpa o terminal entre etapas da fila
  mostrar_saida_fds_console: false # true = mostra a saida completa do FDS no console
  intervalo_status_seg: 30         # intervalo entre mensagens de progresso
